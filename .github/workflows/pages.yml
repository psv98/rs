name: Deploy site to GitHub Pages

# Builds the PUBLIC site as static HTML from data/published/snapshots.json and
# publishes it to the gh-pages branch (Settings → Pages → Deploy from a branch → gh-pages / root).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build static site
        # Default address: https://<owner>.github.io/<repo>/.
        # Own (sub)domain: set the repository variable PAGES_DOMAIN, e.g. crimes.imi.org.ua.
        # Then the site is built for the domain root and out/CNAME is written, so the
        # forced push to gh-pages keeps the custom domain instead of wiping it.
        env:
          PAGES_DOMAIN: ${{ vars.PAGES_DOMAIN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          if [ -n "$PAGES_DOMAIN" ]; then
            export BASE_PATH="" SITE_URL="https://$PAGES_DOMAIN"
          else
            export BASE_PATH="/$REPO" SITE_URL="https://$OWNER.github.io/$REPO"
          fi
          npm run build:static
          if [ -n "$PAGES_DOMAIN" ]; then echo "$PAGES_DOMAIN" > out/CNAME; fi
          echo "SITE_URL=$SITE_URL" >> "$GITHUB_ENV"
      - name: Publish to gh-pages branch
        working-directory: out
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
      - name: Summary
        run: echo "Site → $SITE_URL/" >> "$GITHUB_STEP_SUMMARY"
